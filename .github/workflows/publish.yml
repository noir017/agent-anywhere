name: Publish to npm

# Fenced to the upstream repository. Forks build the same tarball and attach it
# to their own GitHub Release (see release.yml), but they do not own
# `agent-anywhere-cli` on the registry: publishing from one would either fail on
# a 403 or, with credentials that happen to work, push a fork's build as the
# package's `latest`. The registry has one owner, so the workflow does too.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    if: github.repository == 'l0ng-ai/agent-anywhere'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # OIDC trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.9.x,
          # so use Node 24 (bundles npm 11.x)
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # prepublishOnly runs typecheck + tests + build before publishing
      - run: npm publish
