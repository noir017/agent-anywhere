name: Release

# Cuts a GitHub Release from a version tag.
#
# `build.yml` already packs a tarball on every push, but it lands as a workflow
# artifact: it expires, and reaching it needs `gh run download` plus a run id.
# This workflow runs the same gates on a tag and attaches the tarball to a
# permanent Release, so `npm i -g <release-url>` is a URL anyone can paste.
#
# npm publishing is a separate concern and lives in `publish.yml` — which is
# fenced to the upstream repository, since this fork does not own the package
# name on the registry.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write # required to create the Release and upload its assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Resolved once: on a tag push this is the tag, on a manual run it's the input.
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      # A tag that disagrees with package.json produces a Release whose asset
      # installs a different version than its title claims. Fail before building.
      - name: Verify tag matches package.json
        run: |
          tag="${{ steps.tag.outputs.name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match package.json $pkg"
            exit 1
          fi
          echo "$tag matches package.json"

      # `npm ci` (not `npm install`): installs strictly from package-lock.json, so
      # the toolchain here can't drift from what CI validated.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # `npm pack` emits the same tarball `npm publish` would, so what a user
      # installs from the Release is byte-identical to a real release build.
      - name: Pack tarball
        run: |
          mkdir -p dist-pack
          npm pack --pack-destination dist-pack
          cd dist-pack && sha256sum ./*.tgz > SHA256SUMS

      # The CHANGELOG section for this version becomes the Release body, so the
      # notes are the ones already reviewed in the repo rather than a second,
      # drifting copy written at tag time. Falls back to autogenerated notes when
      # the version has no section.
      - name: Extract release notes
        id: notes
        run: |
          version="${{ steps.tag.outputs.name }}"
          # index()/literal prefix rather than a regex: the header contains [ and ]
          # and awk reads a `\[` inside a -v string as a plain bracket, silently
          # turning "## [0.3.0]" into a character class that matches nothing.
          awk -v hdr="## [${version#v}]" '
            index($0, hdr) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          # Non-blank, not merely non-empty: an empty section still yields one
          # newline, which `[ -s ]` would accept as valid notes.
          if grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::no CHANGELOG section for $version; using generated notes"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # `gh` is preinstalled on the runner — no third-party action in the path
      # that uploads release assets.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.notes.outputs.found }}" = "true" ]; then
            notes=(--notes-file RELEASE_NOTES.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "${{ steps.tag.outputs.name }}" \
            dist-pack/*.tgz dist-pack/SHA256SUMS \
            --title "${{ steps.tag.outputs.name }}" \
            --verify-tag \
            "${notes[@]}"
